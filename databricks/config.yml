data:
  raw_csv_path: /Volumes/resume_matcher/bronze/uploads/resume-dataset.csv

chunking:
  window_size: 400        # tokens
  overlap: 50

models:
  # TODO: replace with real endpoint names from your workspace's Serving page —
  # do not deploy with these placeholder names.
  embedding_endpoint: databricks-gte-large-en
  extraction_endpoint: databricks-claude-endpoint
  generation_endpoint: databricks-claude-endpoint

retrieval:
  top_k: 3
  confidence_threshold: 0.72   # tune during eval; every value tried must be a logged MLflow param

scoring:
  weight_must_have: 1.0
  weight_nice_to_have: 0.4

catalog:
  name: resume_matcher
